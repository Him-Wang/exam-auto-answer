<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ExamAutoAnswer</title>
<style>
  :root {
    --bg: #0a0c10;
    --card: #11141b;
    --card-2: #0e1117;
    --line: rgba(255, 255, 255, .07);
    --line-strong: rgba(255, 255, 255, .13);
    --text: #e9ecf4;
    --muted: #7d869c;
    --dim: #59617350;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, .13);
    --ok: #3ecf8e;
    --bad: #ff6b7a;
    --warn: #e0a83c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 18% -12%, rgba(91, 140, 255, .11), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 13.5px/1.5 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 26px 10px;
    max-width: 940px; width: 100%; margin: 0 auto;
  }
  .mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(140deg, #6f9bff, #3f68e0);
    box-shadow: 0 4px 14px rgba(91, 140, 255, .3);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  header h1 { font-size: 14.5px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  header .badge {
    font-size: 11px; color: #a8bcff; background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px;
  }
  header .meta { margin-left: auto; font-size: 11.5px; color: var(--muted); }

  main {
    flex: 1; min-height: 0; width: 100%; max-width: 940px; margin: 0 auto;
    padding: 6px 26px 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .card > h2,
  .log-head h2 {
    font-size: 11.5px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px;
  }
  .log-head h2 { margin: 0; }

  /* ---------- form ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.wide { grid-column: span 2; }
  label { font-size: 11.5px; color: var(--muted); }
  input {
    background: var(--card-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #4d5566; }
  input:focus { border-color: rgba(91, 140, 255, .55); box-shadow: 0 0 0 3px rgba(91, 140, 255, .12); }
  .btn-row { display: flex; gap: 8px; align-items: flex-end; }

  /* ---------- buttons ---------- */
  button {
    background: #1a1f2a; color: var(--text); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 9px 14px; font: inherit; cursor: pointer;
    transition: background .15s, border-color .15s, transform .06s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #222835; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #6d99ff; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
  button.ghost:hover:not(:disabled) { color: var(--text); background: #171b24; }
  button.danger { background: transparent; border-color: rgba(255, 107, 122, .35); color: #ff8d99; }
  button.danger:hover:not(:disabled) { background: rgba(255, 107, 122, .1); }

  /* ---------- stepper ---------- */
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 14px; }
  .step {
    position: relative; text-align: left; padding: 10px 11px; border-radius: 11px;
    background: var(--card-2); border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  .step .idx {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
    letter-spacing: .4px;
  }
  .step .name { font-size: 12.5px; }
  .step[data-state="run"] { border-color: rgba(91, 140, 255, .6); background: rgba(91, 140, 255, .09); }
  .step[data-state="run"] .idx { color: #9fb6ff; }
  .step[data-state="ok"] { border-color: rgba(62, 207, 142, .35); }
  .step[data-state="ok"] .idx { color: var(--ok); }
  .step[data-state="bad"] { border-color: rgba(255, 107, 122, .45); }
  .step[data-state="bad"] .idx { color: var(--bad); }
  .step .tick { position: absolute; right: 9px; top: 9px; font-size: 11px; opacity: 0; }
  .step[data-state="ok"] .tick, .step[data-state="bad"] .tick { opacity: 1; }

  .action-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ---------- status ---------- */
  .status { display: flex; align-items: center; gap: 9px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #39414f; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(62, 207, 142, .15); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(255, 107, 122, .15); }
  .dot.busy { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  #elapsed { margin-left: auto; font-variant-numeric: tabular-nums; }
  .bar { height: 2px; border-radius: 2px; background: transparent; overflow: hidden; margin-top: 10px; }
  .bar.on { background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 40% 100%; animation: slide 1.1s linear infinite; }
  @keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }

  /* ---------- log ---------- */
  .log-wrap { flex: 1; min-height: 120px; display: flex; flex-direction: column; }
  .log-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .log-head h2 { margin: 0; }
  .log-head .spacer { flex: 1; }
  #log {
    flex: 1; min-height: 0; overflow: auto; background: #05070a;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font: 12px/1.6 "Cascadia Mono", Consolas, "Courier New", monospace;
    white-space: pre-wrap; word-break: break-word; color: #aeb7c9;
  }
  #log::-webkit-scrollbar, .steps::-webkit-scrollbar { width: 8px; height: 8px; }
  #log::-webkit-scrollbar-thumb { background: #222835; border-radius: 4px; }
  footer {
    max-width: 940px; width: 100%; margin: 0 auto; padding: 0 26px 14px;
    display: flex; align-items: center; gap: 10px; font-size: 11px; color: #5d6578;
  }
  footer .spacer { flex: 1; }
  kbd {
    font: 10.5px/1 "Cascadia Mono", monospace; color: #8b93a7;
    border: 1px solid var(--line-strong); border-radius: 5px; padding: 2px 5px;
  }
</style>
</head>
<body>
<header>
  <div class="mark">E</div>
  <h1>ExamAutoAnswer</h1>
  <span class="badge">需要 API key</span>
  <span class="meta">登录和验证码在浏览器里自己完成</span>
</header>

<main>
  <section class="card">
    <h2>连接与模型</h2>
    <div class="grid">
      <div class="field">
        <label for="port">调试端口</label>
        <input id="port" value="9223" spellcheck="false" />
      </div>
      <div class="field">
        <label for="url">考试地址（可留空则打开空白页）</label>
        <input id="url" placeholder="https://cssc.wenjuan.com/..." spellcheck="false" />
      </div>
      <div class="field wide">
        <label for="key">API Key</label>
        <input id="key" type="password" placeholder="sk-..." spellcheck="false" />
      </div>
      <div class="field">
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" value="https://api.deepseek.com/v1" spellcheck="false" />
      </div>
      <div class="field">
        <label for="model">模型</label>
        <input id="model" value="deepseek-chat" spellcheck="false" />
      </div>
      <div class="btn-row" style="grid-column: span 2">
        <button id="save">保存配置</button>
        <button id="check" class="ghost">检查配置</button>
        <button id="probe" class="ghost">页面探针</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>流程</h2>
    <div class="steps">
      <div class="step" id="s-launch" data-state="idle"><span class="idx">01</span><span class="name">启动浏览器</span><span class="tick">✓</span></div>
      <div class="step" id="s-harvest" data-state="idle"><span class="idx">02</span><span class="name">抓题</span><span class="tick">✓</span></div>
      <div class="step" id="s-answer" data-state="idle"><span class="idx">03</span><span class="name">出答案</span><span class="tick">✓</span></div>
      <div class="step" id="s-apply" data-state="idle"><span class="idx">04</span><span class="name">写入</span><span class="tick">✓</span></div>
      <div class="step" id="s-verify" data-state="idle"><span class="idx">05</span><span class="name">校验</span><span class="tick">✓</span></div>
      <div class="step" id="s-submit" data-state="idle"><span class="idx">06</span><span class="name">交卷</span><span class="tick">✓</span></div>
    </div>
    <div class="action-row">
      <button id="auto" class="primary">一键跑完（不含交卷）</button>
      <button id="submit" class="danger">6 · 交卷</button>
      <button id="opendir" class="ghost">打开工作目录</button>
    </div>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="state">就绪</span>
      <span id="elapsed"></span>
    </div>
    <div class="bar" id="bar"></div>
  </section>

  <section class="log-wrap">
    <div class="log-head">
      <h2>输出</h2>
      <div class="spacer"></div>
      <button id="clear" class="ghost" style="padding:5px 10px; font-size:11.5px">清空</button>
    </div>
    <div id="log">等待操作…</div>
  </section>
</main>

<footer>
  <span>交卷不可撤销，会消耗考试次数</span>
  <span class="spacer"></span>
  <span>工作目录 <kbd>%APPDATA%\ExamAutoAnswer\work</kbd></span>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $('log');
  const stateEl = $('state');
  const dot = $('dot');
  const bar = $('bar');
  const elapsedEl = $('elapsed');

  const STEPS = {
    launch: 's-launch', harvest: 's-harvest', answer: 's-answer',
    apply: 's-apply', verify: 's-verify', submit: 's-submit',
  };
  const BTNS = ['save', 'check', 'launch', 'probe', 'harvest', 'answer', 'apply', 'verify', 'submit', 'auto', 'opendir', 'clear'];

  let busy = false;
  let timer = 0;
  let startedAt = 0;

  function append(t) {
    log.textContent += t;
    log.scrollTop = log.scrollHeight;
  }
  window.api.onLog(append);

  function setState(text, kind) {
    stateEl.textContent = text;
    dot.className = 'dot' + (kind ? ' ' + kind : '');
    bar.className = 'bar' + (kind === 'busy' ? ' on' : '');
  }

  function markStep(step, state) {
    const el = STEPS[step] && $(STEPS[step]);
    if (!el) return;
    el.dataset.state = state;
    if (state === 'bad') el.querySelector('.tick').textContent = '✕';
    else el.querySelector('.tick').textContent = '✓';
  }

  function startClock() {
    startedAt = Date.now();
    clearInterval(timer);
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      elapsedEl.textContent = s + 's';
    }, 200);
  }
  function stopClock() {
    clearInterval(timer);
    timer = 0;
  }

  function opts() {
    return {
      port: $('port').value.trim() || '9223',
      url: $('url').value.trim(),
      key: $('key').value,
      baseUrl: $('baseUrl').value.trim(),
      model: $('model').value.trim(),
    };
  }

  function lock(on) {
    busy = on;
    BTNS.forEach((id) => { const el = $(id); if (el) el.disabled = on; });
    if (!on) { elapsedEl.textContent = ''; }
  }

  async function call(step, label) {
    lock(true);
    setState(label + '…', 'busy');
    if (STEPS[step]) markStep(step, 'run');
    startClock();
    try {
      const r = await window.api.run(step, opts());
      const ok = r.ok;
      if (ok) { setState(label + ' 完成', 'ok'); if (STEPS[step]) markStep(step, 'ok'); }
      else { setState(label + ' 失败（退出码 ' + r.code + '）', 'bad'); if (STEPS[step]) markStep(step, 'bad'); }
      return r;
    } catch (e) {
      append('\n[error] ' + e.message + '\n');
      setState(label + ' 异常', 'bad');
      if (STEPS[step]) markStep(step, 'bad');
      return { ok: false };
    } finally {
      stopClock();
      lock(false);
    }
  }

  // Steps run by the stepper itself: click a card to run just that step.
  Object.entries(STEPS).forEach(([step, id]) => {
    $(id).onclick = () => {
      if (busy) return;
      if (step === 'submit') return $('submit').click();
      call(step, $(id).querySelector('.name').textContent);
    };
  });

  $('probe').onclick = () => call('probe', '页面探针');
  $('save').onclick = () => call('saveKey', '保存配置');
  $('check').onclick = () => call('checkKey', '检查配置');
  $('clear').onclick = () => { log.textContent = ''; };
  $('opendir').onclick = () => window.api.openWorkDir();

  $('submit').onclick = async () => {
    let n = 0;
    try {
      const raw = await window.api.readFile('answers.json');
      n = Object.keys(JSON.parse(raw || '{}')).length;
    } catch { n = 0; }
    if (!confirm('确认交卷？\n已写入 ' + n + ' 题。交卷通常不可撤销，并会消耗考试次数。')) return;
    await call('submit', '交卷');
  };

  $('auto').onclick = async () => {
    for (const [step, label] of [['harvest', '抓题'], ['answer', '出答案'], ['apply', '写入'], ['verify', '校验']]) {
      const r = await call(step, label);
      if (!r.ok) { append('\n[stopped] ' + label + ' 失败，流程中止。\n'); return; }
    }
    setState('一键流程完成，检查校验结果后再交卷', 'ok');
  };
</script>
</body>
</html>
